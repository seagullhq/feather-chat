[package]
name = "feather-chat"
version = "0.20.1"
edition = "2024"

[profile.release]
# Smallest binary: opt-level "z" trades some speed for size (the user's priority).
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Video hot paths stay fast under opt-level "z" (measured: size-optimized
# openh264/resize were ~1.3-3x slower at 1080p).
[profile.release.package.openh264-sys2]
opt-level = 3
[profile.release.package.yuv]
opt-level = 3
[profile.release.package.fast_image_resize]
opt-level = 3

# Dev builds: release speed, no fat LTO (link minutes -> seconds).
[profile.fast]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16
incremental = true
strip = false

[build-dependencies]
embed-resource = "3"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "78fde14d124dbbb7c6175ec2e25da7028b0573d6" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "78fde14d124dbbb7c6175ec2e25da7028b0573d6", features = [
    "font-kit",
    "wayland",
    "x11",
    "runtime_shaders",
] }
serde_json = "1"
async-channel = "2"
unicode-segmentation = "1"
rand = "0.8"
cpal = { version = "0.18", features = ["pulseaudio"] }
native-theme = { version = "0.7.0", features = ["native", "watch"] }
opus-rs = "0.1.41"
rtrb = "0.4.1"
keyring = { version = "3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "async-secret-service",
    "async-io",
    "crypto-rust",
] }
pulldown-cmark = { version = "0.13", default-features = false }
directories = "6.0.0"
image = { version = "0.25", default-features = false }
rust-embed = { version = "8", default-features = false, features = ["include-exclude"] }
yuv = { version = "0.8", features = ["fast_mode"] }
openh264 = "0.9"
fast_image_resize = "6.2.0"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
# screen capture: XDG ScreenCast portal (pick source, get a PipeWire fd) + PipeWire stream
ashpd = { version = "0.14", default-features = false, features = ["async-io", "screencast"] }
pipewire = "0.10"
async-io = "2"

[target.'cfg(target_os = "windows")'.dependencies]
# screen capture: Windows.Graphics.Capture (gpui picker, BGRA frames)
windows-capture = "=2.0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSImage",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSData",
] }
# Native screen capture: ScreenCaptureKit (macOS 12.3+; 14+ picker with fallback)
screencapturekit = { version = "11.1.2", features = ["macos_14_0"] }

# Installers for the Windows (.msi) and Linux (.AppImage) builds, see the
# package-* tasks in Taskfile.yml. The binary itself is built by `task build`.
[package.metadata.packager]
product-name = "Feather Chat"
identifier = "com.feather.chat"
description = "Chat with your friends"
category = "SocialNetworking"
icons = ["assets/icon.png", "assets/icon.ico"]
binaries = [{ path = "feather-chat", main = true }]
