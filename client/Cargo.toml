[package]
name = "feather-chat"
version = "0.18.23"
edition = "2024"

[profile.release]
# ponytail: size over speed; opt-level measured, see commit message
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Dev builds: release speed, no fat LTO (link minutes -> seconds).
[profile.fast]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16
incremental = true
strip = false

[build-dependencies]
embed-resource = "3"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    "wayland",
    "x11",
    "runtime_shaders",
] }
serde_json = "1"
async-channel = "2"
unicode-segmentation = "1"
rand = "0.8"
cpal = { version = "0.18", features = ["pulseaudio"] }
native-theme = { version = "0.7.0", features = ["native", "watch"] }
opus-rs = "0.1.41"
rtrb = "0.4.1"
keyring = { version = "3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "async-secret-service",
    "async-io",
    "crypto-rust",
] }
pulldown-cmark = { version = "0.13", default-features = false }
directories = "6.0.0"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSImage",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSData",
] }
