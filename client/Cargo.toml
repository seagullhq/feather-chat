[package]
name = "feather-chat"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "wayland", "x11"] }
serde_json = "1"
async-channel = "2"
unicode-segmentation = "1"
rand = "0.8"
cpal = "0.15"
native-theme = { version = "0.7.0", features = ["native", "watch"] }
