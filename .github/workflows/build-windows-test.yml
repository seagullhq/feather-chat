name: Windows build (manual test)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-${{ hashFiles('vcpkg.json') }}

      - name: Configure (CMake windows preset)
        env:
          VCPKG_ROOT: C:/vcpkg
        run: cmake --preset windows

      - name: Build
        run: cmake --build build --preset windows

      - name: Smoke-test .exe starts
        run: |
          $proc = Start-Process -FilePath "build\client\feather-chat.exe" `
            -PassThru -ErrorAction Stop
          Start-Sleep 2
          if ($proc.HasExited -and $proc.ExitCode -ne 0) {
            Write-Error "feather-chat.exe exited with code $($proc.ExitCode)"
            exit 1
          }
          $proc | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host "OK: process started successfully"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feather-chat-windows
          path: build/client/feather-chat.exe
          if-no-files-found: warn
