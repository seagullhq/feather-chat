name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04

    # The integration tests exercise accounts, servers and migrations against a
    # real MongoDB (server/integration_test.go). A service container with a
    # healthcheck makes GitHub wait for it, so the tests cannot silently skip.
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: feather
          MONGO_INITDB_ROOT_PASSWORD: feather-dev-password
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGO_ROOT_USERNAME: feather
      MONGO_ROOT_PASSWORD: feather-dev-password
      MONGO_DBNAME: feather
      MONGO_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: extractions/setup-just@v2

      - name: Install Qt, CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev cmake ninja-build

      # Pinned so the fmt-check gate is deterministic across runs. This is the
      # version the repository is currently formatted with; bump it together
      # with a `just fmt` in the same commit.
      - name: Install clang-format
        run: |
          python3 -m pip install --user --break-system-packages clang-format==23.1.3
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # fmt-check, go vet, the Go tests (integration included) and the client build.
      - run: just check
