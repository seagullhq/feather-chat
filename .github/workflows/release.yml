name: release

# Every push to main. release-plz tags a new version when a release PR was
# merged (the push then carries the bumped Cargo.toml), and opens or updates the
# release PR when there are releasable commits. The build and tests come from
# build.yml, called in this same run. Nothing here relies on a tag push starting
# another workflow: the default GITHUB_TOKEN cannot do that.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read-only by default, jobs opt into write.
permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: tag new version
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      released: ${{ steps.tag.outputs.released }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # release-plz needs the full history and tags to find the last release.
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - name: Version before release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' client/Cargo.toml | head -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi

      # Creates the tag v<version> only if it does not exist yet, i.e. only on the
      # push that merged a release PR. Other pushes are a no-op.
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
          manifest_path: client/Cargo.toml
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Did this run create the tag?
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          WAS_TAGGED: ${{ steps.version.outputs.tagged }}
        run: |
          git fetch --tags --force
          if [ "$WAS_TAGGED" = "false" ] && git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: release
    uses: ./.github/workflows/build.yml
    with:
      release: ${{ needs.release.outputs.released == 'true' }}
      version: ${{ needs.release.outputs.version }}
    # Signing secrets for the Windows build. The called workflow cannot raise
    # permissions, so everything it requests is granted here.
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  publish:
    name: publish release
    # Only after a new version was tagged and its build succeeded.
    needs: [release, build]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Build provenance attestations (free for public repos), verified with
      # `gh attestation verify <file> -R seagullhq/feather-chat`.
      id-token: write
      attestations: write
    steps:
      # v8 required: uploads use archive: false, v7 tries to unzip them and fails.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum feather-chat-* > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/feather-chat-*

      # No checkout in this job, so no git repo: gh works through the API with GH_REPO.
      # The tag was pushed by the release job of this same run.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.release.outputs.version }}
        run: gh release create "$TAG" --generate-notes dist/feather-chat-* dist/SHA256SUMS

  release-pr:
    name: open release PR
    # After the tag step, so the PR is computed from the newest tag.
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      # Opens or updates a PR with the next version and changelog. Nothing is pushed
      # to main: the PR needs one approval, then merging it starts a release.
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
          manifest_path: client/Cargo.toml
        env:
          GITHUB_TOKEN: ${{ github.token }}
