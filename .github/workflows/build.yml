name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege: read-only by default, the release job opts into write.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Pinned images: -latest migrates between OS versions over 1-2 months.
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Cargo target dir is dist/client (see Taskfile.yml CLIENT_TARGET).
          workspaces: |
            client -> ../dist/client

      # Headers found via pkg-config at build time: alsa-sys (cpal), wayland-sys,
      # yeslogic-fontconfig-sys (font-kit). The rest are loaded with dlopen at run time.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libclang-dev \
            libfontconfig-dev \
            libpipewire-0.3-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev

      - name: Build client
        if: runner.os != 'macOS'
        run: task build

      - name: Build macOS app bundle
        if: runner.os == 'macOS'
        run: task bundle-client

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -C dist/client/release -czf feather-chat-linux-x86_64.tar.gz feather-chat

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --keepParent "dist/Feather Chat.app" "feather-chat-macos-$(uname -m).zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/client/release/feather-chat.exe -DestinationPath feather-chat-windows-x86_64.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feather-chat-${{ runner.os }}
          path: feather-chat-*
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum feather-chat-* > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: dist
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes feather-chat-* SHA256SUMS
