name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege: read-only by default, the release job opts into write.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Pinned images: -latest migrates between OS versions over 1-2 months.
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Cargo target dir is dist/client (see Taskfile.yml CLIENT_TARGET).
          workspaces: |
            client -> ../dist/client

      # Headers found via pkg-config at build time: alsa-sys (cpal), wayland-sys,
      # yeslogic-fontconfig-sys (font-kit). The rest are loaded with dlopen at run time.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          # ponytail: runner ships a Microsoft apt repo that now returns 403; drop it.
          sudo rm -f /etc/apt/sources.list.d/*microsoft*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libclang-dev \
            libfontconfig-dev \
            libpipewire-0.3-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        if: runner.os != 'macOS'
        with:
          tool: cargo-packager@0.11.8

      - name: Build client
        if: runner.os != 'macOS'
        run: task build

      - name: Build macOS app bundle
        if: runner.os == 'macOS'
        run: task bundle-client

      # signtool is not on PATH on windows-2025: add the newest Windows SDK
      # copy to PATH for the signing steps below.
      - name: Locate signtool
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $st) { throw "signtool.exe not found: install the Windows SDK" }
          Add-Content -Path $env:GITHUB_PATH -Value $st.DirectoryName

      # Optional: signs the exe and the msi when the secrets are set (a PFX
      # from a paid or free OSS code-signing certificate). Without them the
      # installer ships unsigned and Windows SmartScreen warns on first run.
      - name: Sign Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_B64) { Write-Host "No signing certificate, skipping"; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          signtool sign /fd SHA256 /f $pfx /p $env:PFX_PASS /tr http://timestamp.digicert.com /td SHA256 dist/client/release/feather-chat.exe
          Remove-Item $pfx

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: task package-msi

      - name: Sign Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_B64) { exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          $msi = Get-ChildItem dist/packages -Filter *.msi | Select-Object -First 1
          signtool sign /fd SHA256 /f $pfx /p $env:PFX_PASS /tr http://timestamp.digicert.com /td SHA256 $msi.FullName
          Remove-Item $pfx

      - name: Build MSIX (Microsoft Store)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
        run: task package-msix

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -C dist/client/release -czf feather-chat-linux-x86_64.tar.gz feather-chat

      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        run: task package-appimage

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --keepParent "dist/Feather Chat.app" feather-chat-macos-arm64.zip
          task dmg
          mv dist/feather-chat-macos.dmg feather-chat-macos-arm64.dmg

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/client/release/feather-chat.exe -DestinationPath feather-chat-windows-x86_64.zip
          Copy-Item (Get-ChildItem dist/packages -Filter *.msi | Select-Object -First 1).FullName feather-chat-windows-x86_64.msi
          Copy-Item dist/packages/feather-chat-windows-x86_64.msix feather-chat-windows-x86_64.msix

      - name: Collect AppImage (Linux)
        if: runner.os == 'Linux'
        run: cp dist/packages/*.AppImage feather-chat-linux-x86_64.AppImage

      # One artifact per file, not zipped: GitHub otherwise wraps each upload
      # in an extra zip, so the run shows one zip per OS.
      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feather-chat-linux-x86_64.AppImage
          path: feather-chat-linux-x86_64.AppImage
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux tarball
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feather-chat-linux-x86_64.tar.gz
          path: feather-chat-linux-x86_64.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload macOS dmg
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feather-chat-macos-arm64.dmg
          path: feather-chat-macos-arm64.dmg
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload macOS zip
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feather-chat-macos-arm64.zip
          path: feather-chat-macos-arm64.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows msi
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feather-chat-windows-x86_64.msi
          path: feather-chat-windows-x86_64.msi
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows msix
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feather-chat-windows-x86_64.msix
          path: feather-chat-windows-x86_64.msix
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows zip
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feather-chat-windows-x86_64.zip
          path: feather-chat-windows-x86_64.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

  test-server:
    name: test server
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # config.PostgresURI() hardcodes port 5432, so map the service onto it.
    # The integration tests apply the migrations to this throwaway database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: feather
          POSTGRES_PASSWORD: feather
          POSTGRES_DB: feather_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U feather -d feather_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_USER: feather
      POSTGRES_PASSWORD: feather
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_DB: feather_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Test server
        run: task test-server

  test-client:
    name: test client (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            client -> ../dist/client

      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: |
          # ponytail: runner ships a Microsoft apt repo that now returns 403; drop it.
          sudo rm -f /etc/apt/sources.list.d/*microsoft*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libclang-dev \
            libfontconfig-dev \
            libpipewire-0.3-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev

      - name: Test client
        run: task test-client

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Build provenance attestations (free for public repos), verified with
      # `gh attestation verify <file> -R seagullhq/feather-chat`.
      id-token: write
      attestations: write
    steps:
      # v8 required: uploads use archive: false, v7 tries to unzip them and fails.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum feather-chat-* > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/feather-chat-*

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: dist
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes feather-chat-* SHA256SUMS
